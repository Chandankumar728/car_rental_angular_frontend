<!-- Guest Navbar (Not logged in) -->
<nav *ngIf="!isLoggedIn" class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="#"> <i class="bi bi-car-front-fill"></i> Car Rental System </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/register">Sign Up</a>
      </li>
      <li class="nav-item">
        <a class="btn btn-outline-light ms-3" routerLink="/login">Login</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Admin Navbar -->
<nav *ngIf="isAdminLoggedIn" class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
  <a class="navbar-brand" href="#"> <i class="bi bi-shield-check"></i> Admin Panel </a>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/dashboard">Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="btn btn-outline-light ms-3" (click)="logout()">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Customer Navbar -->
<nav *ngIf="isCustomer" class="navbar navbar-expand-lg navbar-dark bg-success px-3">
  <a class="navbar-brand" href="#"> <i class="bi bi-car-front-fill"></i> Customer Pannel </a>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/customer/dashboard">Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="btn btn-outline-light ms-3" (click)="logout()">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<router-outlet></router-outlet>
