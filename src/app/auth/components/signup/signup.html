<section class="vh-100 bg-image"
  style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask d-flex align-items-center h-100 gradient-custom-3">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="card" style="border-radius: 5px;">
            <div class="card-body p-3">

              <h3 class="text-uppercase text-center mb-4 fw-bold" style="font-size:1.3rem;">
                Create an Account
              </h3>

              <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

                <!-- Name -->
                <div class="form-outline mb-3">
                  <input type="text" class="form-control form-control-sm" placeholder="Your Name" formControlName="name"/>
                  <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="text-danger small">
                    Name is required
                  </div>
                </div>

                <!-- Email -->
                <div class="form-outline mb-3">
                  <input type="email" class="form-control form-control-sm" placeholder="Your Email" formControlName="email"/>
                  <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="text-danger small">
                    <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required</span>
                    <span *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format</span>
                  </div>
                </div>

                <!-- Password -->
                <div class="form-outline mb-3">
                  <input type="password" class="form-control form-control-sm" placeholder="Password" formControlName="password"/>
                  <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="text-danger small">
                    <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</span>
                    <span *ngIf="signupForm.get('password')?.errors?.['minlength']">Minimum 6 characters</span>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-outline mb-3">
                  <input type="password" class="form-control form-control-sm" placeholder="Repeat Password" formControlName="checkPassword"/>
                  <div *ngIf="signupForm.get('checkPassword')?.touched" class="text-danger small">
                    <span *ngIf="signupForm.get('checkPassword')?.errors?.['required']">Confirm password is required</span>
                    <span *ngIf="signupForm.errors?.['passwordsMismatch']">Passwords do not match</span>
                  </div>
                </div>

                <div class="form-check mb-3 small">
                  <input class="form-check-input" type="checkbox" id="termsCheck" />
                  <label class="form-check-label" for="termsCheck">
                    I agree all statements in <a href="#!" class="text-body"><u>Terms of service</u></a>
                  </label>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-sm mb-2" [disabled]="isSpinning || signupForm.invalid">
                  <span *ngIf="isSpinning" class="spinner-border spinner-border-sm me-2"></span>
                  Register
                </button>

                <p class="text-center text-muted small mb-0">
                  Already have an account? <a routerLink="/login" class="text-body"><u>Login here</u></a>
                </p>

              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
