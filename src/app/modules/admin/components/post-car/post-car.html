<div class="container p-3" style="max-width: 550px; font-size: 13px;">
  <div class="card shadow-sm" style="border-radius: 8px;">
    <div class="card-header text-center py-2" 
         style="background:#0d6efd; color:white; font-size:14px;">
      <strong>Post Your Car</strong>
    </div>

  

<form [formGroup]="postCarForm" enctype="multipart/form-data" >
    <div class="card-body p-3">

      <!-- Image Upload -->
      <label class="form-label mb-1">Car Image</label>
      <input type="file" class="form-control form-control-sm mb-2" (change)="onFileSelected($event)"> >

      <!-- Brand -->
      <label class="form-label mb-1">Brand Name</label>
      <select class="form-select form-select-sm mb-2" formControlName="brand">
        <option selected disabled>Select Brand</option>
        <option>Toyota</option>
        <option>Honda</option>
        <option>BMW</option>
        <option>Mercedes</option>
      </select>

      <!-- Transmission -->
      <label class="form-label mb-1">Transmission</label>
      <select class="form-select form-select-sm mb-2" formControlName="transmission">
        <option selected disabled>Select Transmission</option>
        <option>Automatic</option>
        <option>Manual</option>
      </select>

      <!-- Color -->
      <label class="form-label mb-1">Color</label>
      <select class="form-select form-select-sm mb-2" formControlName="color">
        <option selected disabled>Select Color</option>
        <option>Black</option>
        <option>White</option>
        <option>Blue</option>
        <option>Red</option>
      </select>

      <!-- Type -->
      <label class="form-label mb-1">Car Type</label>
      <select class="form-select form-select-sm mb-2" formControlName="type">
        <option selected disabled>Select Type</option>
        <option>Sedan</option>
        <option>SUV</option>
        <option>Hatchback</option>
        <option>Coupe</option>
      </select>

      <!-- Modal year -->
        <label class="form-label mb-1">Modal Year</label>
        <input type="date" class="form-control form-control-sm mb-2" placeholder="Enter modal year" formControlName="modalYear">


      <!-- Price -->
      <label class="form-label mb-1">Price</label>
      <input type="number" class="form-control form-control-sm mb-2" placeholder="Enter price" formControlName="price">

      <!-- Description -->
      <label class="form-label mb-1">Description</label>
      <textarea class="form-control form-control-sm mb-2" rows="3"
                placeholder="Describe the car" formControlName="description"></textarea>

      <button class="btn btn-primary w-100 btn-sm mt-2"
              style="font-size:13px;" (click)="postcar()">
        Submit Car Post
      </button>

    </div>
</form>
  </div>
</div>
